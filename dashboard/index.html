<!DOCTYPE html>
<html lang="zh-CN" class="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>MyApi · 网关控制台</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet" />
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          fontFamily: {
            sans: ['Inter', 'system-ui', 'sans-serif'],
            mono: ['JetBrains Mono', 'monospace'],
          },
          colors: {
            accent: '#22d3ee', // cyan-400
          },
        },
      },
    };
  </script>
  <link rel="stylesheet" href="css/styles.css?v=2" />
  <script src="https://cdn.jsdelivr.net/npm/marked@12.0.2/marked.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/dompurify@3.0.11/dist/purify.min.js"></script>
  <style>
    .md-body { font-size: 13px; line-height: 1.75; color: #d4d4d8; }
    .md-body h1, .md-body h2, .md-body h3, .md-body h4 { color: #fff; font-weight: 700; margin: 1.4em 0 .6em; line-height: 1.3; }
    .md-body h1 { font-size: 22px; border-bottom: 1px solid #27272a; padding-bottom: .4em; }
    .md-body h2 { font-size: 17px; border-bottom: 1px solid #27272a; padding-bottom: .3em; }
    .md-body h3 { font-size: 15px; }
    .md-body p { margin: .7em 0; }
    .md-body a { color: #22d3ee; text-decoration: none; }
    .md-body a:hover { text-decoration: underline; }
    .md-body ul, .md-body ol { margin: .6em 0; padding-left: 1.4em; }
    .md-body li { margin: .25em 0; list-style: disc; }
    .md-body ol li { list-style: decimal; }
    .md-body code { background: #18181b; border: 1px solid #27272a; border-radius: 4px; padding: .1em .35em; font-family: 'JetBrains Mono', monospace; font-size: 12px; color: #22d3ee; }
    .md-body pre { background: #09090b; border: 1px solid #27272a; border-radius: 8px; padding: 12px 14px; overflow: auto; margin: .8em 0; }
    .md-body pre code { background: none; border: none; padding: 0; color: #e4e4e7; }
    .md-body blockquote { border-left: 3px solid #22d3ee55; padding-left: 12px; color: #a1a1aa; margin: .8em 0; }
    .md-body table { width: 100%; border-collapse: collapse; margin: .8em 0; font-size: 12px; }
    .md-body th, .md-body td { border: 1px solid #27272a; padding: 6px 10px; text-align: left; }
    .md-body th { background: #18181b; color: #fff; }
    .md-body hr { border: none; border-top: 1px solid #27272a; margin: 1.2em 0; }
  </style>
</head>
<body class="font-sans antialiased bg-zinc-950 text-white transition-colors duration-300">

  <div class="flex min-h-screen">

    <!-- ============ 侧边栏 ============ -->
    <aside id="sidebar" class="fixed inset-y-0 left-0 z-40 hidden w-60 flex-col border-r border-zinc-800/80 bg-zinc-950/90 backdrop-blur transition-all duration-300 lg:flex">
      <!-- Logo -->
      <div class="flex h-16 items-center gap-3 px-5 border-b border-zinc-800/80">
        <div class="grid h-9 w-9 place-items-center rounded-lg bg-gradient-to-br from-cyan-400 to-blue-500 shadow-lg shadow-cyan-500/20">
          <svg class="h-5 w-5 text-zinc-950" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M13 2 3 14h7l-1 8 11-13h-7l1-7z" />
          </svg>
        </div>
        <div class="leading-tight">
          <div class="text-sm font-bold tracking-wide">MyApi</div>
          <div class="text-[11px] text-zinc-400">LLM API 网关</div>
        </div>
      </div>

      <!-- 导航 -->
      <nav id="nav" class="flex-1 overflow-y-auto px-3 py-4 space-y-1"></nav>

      <!-- 侧边栏底部：网关状态 -->
      <div class="p-3 border-t border-zinc-800/80">
        <div id="gateway-status" class="rounded-xl border border-zinc-800 bg-zinc-900/60 p-3"></div>
      </div>
    </aside>

    <!-- ============ 主区域 ============ -->
    <div class="flex min-h-screen flex-1 flex-col transition-all duration-300 lg:ml-60">

      <!-- 顶栏 -->
      <header class="sticky top-0 z-30 flex h-16 items-center gap-4 border-b border-zinc-800/80 bg-zinc-950/80 backdrop-blur px-4 sm:px-6">
        <!-- 面包屑 -->
        <nav id="breadcrumb" class="flex items-center gap-1.5 text-sm"></nav>

        <div class="flex-1"></div>

        <!-- 全局搜索 -->
        <div class="relative hidden md:block">
          <svg class="pointer-events-none absolute left-3 top-1/2 h-4 w-4 -translate-y-1/2 text-zinc-400" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
            <circle cx="11" cy="11" r="7" /><path d="m20 20-3.5-3.5" />
          </svg>
          <input id="global-search" type="text" placeholder="搜索用户 / 渠道 / 模型…"
                 class="h-9 w-72 rounded-lg border border-zinc-800 bg-zinc-900 pl-9 pr-12 text-sm outline-none placeholder:text-zinc-500 focus:border-cyan-400/60 focus:ring-2 focus:ring-cyan-400/20 transition" />
          <kbd class="pointer-events-none absolute right-2.5 top-1/2 -translate-y-1/2 rounded border border-zinc-700 bg-zinc-800 px-1.5 py-0.5 font-mono text-[10px] text-zinc-400">⌘K</kbd>
        </div>

        <!-- 主题切换 -->
        <button id="theme-toggle" aria-label="切换主题"
                class="grid h-9 w-9 place-items-center rounded-lg border border-zinc-800 text-zinc-400 hover:border-cyan-400/50 hover:text-cyan-400 hover:bg-cyan-400/5 transition">
          <svg class="h-4 w-4 dark:hidden" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2m0 16v2M4.9 4.9l1.4 1.4m11.4 11.4 1.4 1.4M2 12h2m16 0h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
          <svg class="h-4 w-4 hidden dark:block" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.8A9 9 0 1 1 11.2 3 7 7 0 0 0 21 12.8z"/></svg>
        </button>

        <!-- 通知铃铛 -->
        <button id="notify-btn" aria-label="通知"
                class="relative grid h-9 w-9 place-items-center rounded-lg border border-zinc-800 text-zinc-400 hover:border-cyan-400/50 hover:text-cyan-400 hover:bg-cyan-400/5 transition">
          <svg class="h-4 w-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 8a6 6 0 0 1 12 0c0 7 3 9 3 9H3s3-2 3-9"/><path d="M10.3 21a1.94 1.94 0 0 0 3.4 0"/></svg>
          <span class="absolute -right-0.5 -top-0.5 grid h-4 w-4 place-items-center rounded-full bg-amber-400 text-[9px] font-bold text-zinc-950">3</span>
        </button>

        <!-- 用户头像 -->
        <button class="flex items-center gap-2.5 rounded-lg border border-zinc-800 py-1 pl-1 pr-2.5 hover:border-cyan-400/50 transition">
          <span class="grid h-7 w-7 place-items-center rounded-md bg-gradient-to-br from-cyan-400 to-blue-500 text-[11px] font-bold text-zinc-950">OP</span>
          <span class="hidden text-left leading-tight sm:block">
            <span class="block text-xs font-semibold">Admin</span>
            <span class="block text-[10px] text-zinc-400">平台运营</span>
          </span>
        </button>
      </header>

      <!-- 主内容：Bento Grid -->
      <main class="flex-1 p-4 sm:p-6">
        <!-- 页面标题行 -->
        <div class="mb-6 flex flex-col gap-4 sm:flex-row sm:items-end sm:justify-between">
          <div>
            <h1 id="page-title" class="text-xl font-bold">运营仪表盘</h1>
            <p id="page-subtitle" class="mt-1 text-sm text-zinc-400">网关运行总览 · 数据更新于 <span id="updated-at" class="font-mono text-cyan-400"></span></p>
          </div>
          <div class="flex gap-2" id="page-actions"></div>
        </div>

        <!-- Bento 网格 -->
        <div id="bento" class="grid grid-cols-12 gap-4"></div>
      </main>
    </div>
  </div>

  <div id="toast-root" class="pointer-events-none fixed right-4 top-4 z-[200] flex flex-col gap-2"></div>
  <div id="modal-root"></div>

  <script src="js/components.js?v=2"></script>
  <script src="js/data.js?v=2"></script>
  <script src="js/views/dashboard.js?v=2"></script>
  <script src="js/views/usage.js?v=2"></script>
  <script src="js/views/logs.js?v=2"></script>
  <script src="js/views/channels.js?v=2"></script>
  <script src="js/views/models.js?v=2"></script>
  <script src="js/views/users.js?v=2"></script>
  <script src="js/views/limits.js?v=2"></script>
  <script src="js/views/pricing.js?v=2"></script>
  <script src="js/views/settings.js?v=2"></script>
  <script src="js/views/docs.js?v=2"></script>
  <script src="js/core.js?v=2"></script>
</body>
</html>
