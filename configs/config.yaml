server:
  host: "0.0.0.0"
  port: 8080
  mode: debug            # debug / release

database:
  enabled: true
  host: "127.0.0.1"
  port: 5432
  user: postgres
  password: postgres
  name: myapi
  sslmode: disable
  max_open_conns: 20
  max_idle_conns: 10
  auto_migrate: false   # true = 按 gorm 模型建表；正式库建议用仓库内 SQL 建表

redis:
  enabled: true
  addr: "127.0.0.1:6379"
  password: ""
  db: 0

upstream:
  cache_ttl_seconds: 3        # 渠道快照刷新间隔(多节点收敛窗口, 越短一致越快)
  retire_grace_seconds: 600   # 退役渠道强制回收宽限(在途请求最长存活)
  events_channel: "myapi:channel:events"
  breaker_max_requests: 1     # 半开探测放行数
  breaker_interval_seconds: 0 # 熔断计数周期, 0=不按周期重置
  breaker_timeout_seconds: 30 # Open->HalfOpen 等待
  breaker_consecutive_failures: 5  # 连续失败达到该值触发熔断
  max_forward_attempts: 2    # 转发失败可尝试的上游渠道次数
  health_timeout_seconds: 8  # /test 健康检查单次硬超时
  dial_timeout_seconds: 5    # 上游建连超时
  tls_handshake_timeout_seconds: 5

routing:
  sticky_enabled: true        # 按 user_id 粘性路由（Redis 亲和）
  sticky_ttl_seconds: 1800    # 亲和有效期
  max_attempts_per_priority: 0  # 每个优先级组最多尝试数, 0=整组
  try_next_priority: true     # 整组失败后降级到下一优先级
  max_total_attempts: 0       # 总尝试上限, 0=不限(受候选数约束)

billing:
  enabled: true               # 预冻结(Redis) + 结算扣费
  default_output_budget: 1024 # 未传 max_tokens 时冻结用的输出预算
  default_encoding: "cl100k_base"  # 未知模型分词回退编码
  balance_ttl_seconds: 3600   # Redis 余额缓存 TTL
  lock_ttl_seconds: 3         # 余额缓存重建锁 TTL

rate_limit:
  cache_ttl_seconds: 2   # 限流规则本地缓存刷新
  chars_per_token: 4     # token 估算系数(仅用于 tpm/tpd 预估计入)

stats:
  flush_interval_seconds: 5  # Redis 增量刷入 user_daily_stats 的短定时
  timezone: "UTC"            # 统计自然日时区
  redis_ttl_hours: 168       # 增量键 TTL

log:
  level: info            # debug / info / warn / error
  format: text           # text / json
