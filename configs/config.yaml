server:
  host: "0.0.0.0"
  port: 8080
  mode: debug            # debug / release

database:
  enabled: true
  host: "127.0.0.1"
  port: 5432
  user: postgres
  password: postgres
  name: myapi
  sslmode: disable
  max_open_conns: 20
  max_idle_conns: 10
  auto_migrate: false   # true = 按 gorm 模型建表；正式库建议用仓库内 SQL 建表

redis:
  enabled: true
  addr: "127.0.0.1:6379"
  password: ""
  db: 0

log:
  level: info            # debug / info / warn / error
  format: text           # text / json
